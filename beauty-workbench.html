<title>珞莎美妆工作室 · 龙丽莎的工作台</title>
<style>
:root {
  --primary:#e8537a; --primary-light:#fce4ec; --primary-dark:#c62828;
  --bg:#fafafa; --card:#fff; --text:#333; --text-secondary:#888; --border:#eee;
  --success:#4caf50; --warning:#ff9800; --danger:#f44336; --info:#2196f3;
  --shadow:0 2px 12px rgba(0,0,0,0.08); --radius:16px; --radius-sm:10px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;
  background:var(--bg); color:var(--text); max-width:500px; margin:0 auto;
  min-height:100vh; padding-bottom:20px; -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
@media(min-width:768px){body{-webkit-user-select:auto;user-select:auto;}}
}
.header {
  background:linear-gradient(135deg,#e8537a,#f06292); color:#fff;
  padding:14px 16px; display:flex; align-items:center; gap:12px;
  position:sticky; top:0; z-index:120; box-shadow:0 2px 16px rgba(232,83,122,0.3);
}
.menu-btn {
  background:rgba(255,255,255,0.25); border:none; color:#fff;
  width:36px; height:36px; border-radius:10px; font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.header-titles { flex:1; min-width:0; }
.header h1 { font-size:17px; font-weight:700; }
.header .subtitle { font-size:11px; opacity:0.85; margin-top:2px; }
body { padding-top:env(safe-area-inset-top); padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
.header { padding-top:calc(14px + env(safe-area-inset-top)); }
.home-cover { padding-top:calc(36px + env(safe-area-inset-top)); }
.seg { display:flex; gap:4px; background:#f2f2f2; padding:4px; border-radius:10px; }
.seg-btn { flex:1; border:none; background:none; padding:7px 4px; border-radius:8px; font-size:13px; color:var(--text-secondary); cursor:pointer; transition:.15s; }
.seg-btn.active { background:#fff; color:var(--primary); font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
.pie-card { background:linear-gradient(135deg,#fff5f7,#fce4ec); border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 4px 20px rgba(232,83,122,0.12); border:1px solid rgba(232,83,122,0.08); }
.pie-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.pie-card-head > span { font-size:14px; font-weight:700; color:var(--primary); }
.pie-wrap { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.pie-wrap svg { display:block; filter:drop-shadow(0 4px 12px rgba(232,83,122,0.2)); transition:transform 0.3s; }
.pie-wrap svg:hover { transform:translateY(-3px); }
.pie-legend { flex:1; min-width:140px; display:flex; flex-direction:column; gap:6px; }
.pie-legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text); padding:4px 8px; border-radius:8px; cursor:pointer; transition:background 0.15s; }
.pie-legend-item:hover, .pie-legend-item.active { background:rgba(255,255,255,0.7); }
.pie-legend-item .dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.pie-legend-item b { margin-left:auto; font-weight:700; }
.pie-segment { cursor:pointer; transition:opacity 0.2s; }
.pie-segment:hover { opacity:0.85; }
.pie-segment.dim { opacity:0.35; }
.month-nav { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.month-nav .btn-sm { flex:0 0 auto; padding:6px 10px; }
.month-input { flex:1; min-width:0; border:1px solid var(--border); border-radius:10px; padding:8px 10px; font-size:14px; color:var(--text); background:#fff; text-align:center; }
.status-inline { border:1px solid var(--border); border-radius:8px; padding:5px 8px; font-size:12px; background:#fff; color:var(--text); max-width:120px; }
.form-row { display:flex; gap:10px; flex-wrap:wrap; }
.form-row .form-group { flex:1 1 150px; min-width:0; }
.cover-edit-btn { position:absolute; top:calc(12px + env(safe-area-inset-top)); right:14px; background:rgba(255,255,255,0.3); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,0.5); color:#fff; font-size:12px; padding:6px 12px; border-radius:20px; cursor:pointer; }
.stat-item { background:rgba(255,255,255,0.2); border-radius:8px; padding:4px 8px; text-align:center; flex:0 0 auto; }
.drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:200; display:none; opacity:0; transition:opacity 0.25s; }
.drawer-overlay.open { display:block; opacity:1; }
.drawer { position:fixed; top:0; left:0; height:100%; width:80%; max-width:320px; background:#fff; z-index:210; transform:translateX(-100%); transition:transform 0.28s cubic-bezier(0.4,0,0.2,1); overflow-y:auto; padding-bottom:30px; box-shadow:2px 0 20px rgba(0,0,0,0.15); }
.drawer.open { transform:translateX(0); }
.drawer-header { background:linear-gradient(135deg,#e8537a,#f06292); color:#fff; padding:24px 18px 18px; display:flex; align-items:center; gap:12px; }
.drawer-header .logo { font-size:32px; }
.drawer-header .dh-title { font-size:16px; font-weight:700; }
.drawer-header .dh-sub { font-size:11px; opacity:0.85; }
.nav-home { display:flex; align-items:center; gap:10px; padding:14px 18px; cursor:pointer; font-size:15px; font-weight:700; color:var(--primary); border-bottom:1px solid var(--border); }
.nav-group { margin-top:4px; }
.nav-group-header { display:flex; align-items:center; gap:8px; padding:14px 18px 8px; font-size:13px; font-weight:700; color:var(--text-secondary); cursor:pointer; }
.nav-group-header .chev { margin-left:auto; font-size:12px; transition:transform 0.2s; color:var(--text-secondary); }
.nav-group.collapsed .chev { transform:rotate(-90deg); }
.nav-group.collapsed .nav-sub { display:none; }
.nav-item { display:flex; align-items:center; gap:10px; padding:12px 18px 12px 46px; cursor:pointer; font-size:14px; color:var(--text); border-left:3px solid transparent; transition:all 0.15s; }
.nav-item:active { background:var(--primary-light); }
.nav-item.active { background:var(--primary-light); color:var(--primary); font-weight:600; border-left-color:var(--primary); }
.content { padding:14px; display:none; }
.content.active { display:block; animation:fadeIn 0.2s; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
.card { background:var(--card); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:var(--shadow); }
.card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.card-header h3 { font-size:16px; font-weight:600; }
.card-header .count { font-size:12px; color:var(--primary); background:var(--primary-light); padding:3px 10px; border-radius:20px; }
.btn { padding:10px 18px; border:none; border-radius:20px; font-size:14px; font-weight:600; cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; gap:6px; }
.btn:active { transform:scale(0.96); }
.btn-primary { background:var(--primary); color:#fff; }
.btn-outline { background:#fff; color:var(--primary); border:1.5px solid var(--primary); }
.btn-sm { padding:6px 14px; font-size:12px; border-radius:14px; }
.btn-block { width:100%; justify-content:center; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-xs { padding:4px 10px; font-size:11px; border-radius:10px; }
input,textarea,select { width:100%; padding:11px 13px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:inherit; background:var(--bg); transition:border-color 0.2s; outline:none; }
input:focus,textarea:focus,select:focus { border-color:var(--primary); }
textarea { resize:vertical; min-height:60px; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text-secondary); }
.list-item { display:flex; align-items:center; padding:11px 0; border-bottom:1px solid var(--border); gap:10px; }
.list-item:last-child { border-bottom:none; }
.item-avatar { width:42px; height:42px; border-radius:50%; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; flex-shrink:0; }
.item-info { flex:1; min-width:0; }
.item-title { font-size:15px; font-weight:600; }
.item-sub { font-size:12px; color:var(--text-secondary); margin-top:2px; }
.item-actions { display:flex; gap:6px; flex-shrink:0; }
.tag { display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
.tag-pink { background:var(--primary-light); color:var(--primary); }
.tag-blue { background:#e3f2fd; color:var(--info); }
.tag-green { background:#e8f5e9; color:var(--success); }
.tag-orange { background:#fff3e0; color:var(--warning); }
.tag-red { background:#ffebee; color:var(--danger); }
.tag-gray { background:#f5f5f5; color:var(--text-secondary); }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:300; display:flex; align-items:flex-end; justify-content:center; }
.modal { background:#fff; width:100%; max-width:500px; border-radius:20px 20px 0 0; padding:20px; max-height:88vh; overflow-y:auto; animation:slideUp 0.3s ease; }
@keyframes slideUp { from{transform:translateY(100%);} to{transform:translateY(0);} }
.modal h3 { font-size:18px; margin-bottom:16px; }
.modal-actions { display:flex; gap:10px; margin-top:20px; }
.search-bar { display:flex; gap:8px; margin-bottom:14px; }
.search-bar input { flex:1; }
.empty-state { text-align:center; padding:36px 20px; color:var(--text-secondary); }
.empty-state .empty-icon { font-size:44px; margin-bottom:10px; }
.ai-tpl-card { background:var(--bg); border-radius:var(--radius-sm); padding:14px; margin-bottom:10px; border-left:3px solid var(--primary); }
.ai-tpl-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.ai-tpl-head .tpl-icon { font-size:20px; }
.ai-tpl-head .tpl-name { font-size:15px; font-weight:600; flex:1; }
.ai-tpl-text { width:100%; min-height:100px; border:1px solid var(--border); border-radius:8px; padding:10px; font-size:13px; line-height:1.6; resize:vertical; background:#fff; }
.copy-btn { padding:4px 10px; font-size:11px; border-radius:10px; border:1px solid var(--primary); background:#fff; color:var(--primary); cursor:pointer; }
.fab { position:fixed; bottom:24px; right:calc(50% - 230px); width:50px; height:50px; border-radius:50%; background:var(--primary); color:#fff; border:none; font-size:26px; cursor:pointer; box-shadow:0 4px 16px rgba(232,83,122,0.4); z-index:90; display:flex; align-items:center; justify-content:center; }
.fab:active { transform:scale(0.9); }
@media(min-width:500px){ .fab{ right:calc(50% - 250px);} }
.calendar-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.month-label { font-size:16px; font-weight:700; }
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center; }
.day-label { font-size:11px; color:var(--text-secondary); padding:4px; font-weight:600; }
.day-cell { padding:8px 2px; border-radius:8px; cursor:pointer; font-size:13px; position:relative; }
.day-cell.today { background:var(--primary); color:#fff; font-weight:700; }
.day-cell.has-appt::after { content:''; position:absolute; bottom:2px; left:50%; transform:translateX(-50%); width:5px; height:5px; border-radius:50%; background:var(--primary); }
.day-cell.today.has-appt::after { background:#fff; }
.day-cell.selected { background:var(--primary-light); color:var(--primary); font-weight:700; }
.day-cell.other-month { color:#ccc; }
.appt-item { display:flex; align-items:center; padding:10px 12px; background:var(--bg); border-radius:var(--radius-sm); margin-bottom:8px; gap:10px; }
.appt-time { font-size:13px; font-weight:700; color:var(--primary); min-width:50px; }
.appt-info { flex:1; }
.appt-name { font-size:14px; font-weight:600; }
.appt-service { font-size:12px; color:var(--text-secondary); }
.appt-status { font-size:11px; padding:3px 8px; border-radius:10px; font-weight:600; flex-shrink:0; }
.appt-status.confirmed { background:#e3f2fd; color:var(--info); }
.appt-status.completed { background:#e8f5e9; color:var(--success); }
.appt-status.cancelled { background:#f5f5f5; color:var(--text-secondary); }
.summary-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
.summary-card { background:var(--card); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); }
.summary-label { font-size:12px; color:var(--text-secondary); }
.summary-value { font-size:22px; font-weight:700; margin:4px 0; }
.summary-card.income .summary-value { color:var(--primary); }
.summary-card.expense .summary-value { color:var(--danger); }
.alert-bar { padding:10px 14px; border-radius:var(--radius-sm); font-size:13px; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.alert-warning { background:#fff3e0; color:#e65100; }
.trend-card { padding:14px; background:var(--bg); border-radius:var(--radius-sm); margin-bottom:10px; border-left:3px solid var(--primary); }
.trend-title { font-size:15px; font-weight:600; margin-bottom:3px; }
.trend-meta { font-size:12px; color:var(--text-secondary); }
.trend-notes { font-size:13px; color:var(--text); margin-top:5px; line-height:1.5; }
.trend-tags { margin-top:7px; display:flex; flex-wrap:wrap; gap:4px; }
.topic-card { padding:13px; background:var(--bg); border-radius:var(--radius-sm); margin-bottom:10px; border-left:3px solid var(--info); }
.topic-title { font-size:15px; font-weight:600; }
.topic-meta { font-size:12px; color:var(--text-secondary); display:flex; gap:8px; flex-wrap:wrap; margin-top:5px; }
.topic-notes { font-size:13px; margin-top:6px; color:var(--text); line-height:1.5; }
.script-mgmt-item { padding:13px; background:var(--bg); border-radius:var(--radius-sm); margin-bottom:10px; }
.script-mgmt-title { font-size:15px; font-weight:600; color:var(--text); cursor:pointer; }
.script-mgmt-title:active { color:var(--primary); }
.script-mgmt-meta { font-size:12px; color:var(--text-secondary); display:flex; gap:8px; flex-wrap:wrap; margin-top:5px; }
.script-mgmt-actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.shoot-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin-bottom:10px; border-radius:var(--radius-sm); border:1.5px solid var(--border); }
.shoot-table { width:100%; min-width:900px; border-collapse:collapse; font-size:12px; }
.shoot-table th { background:var(--primary); color:#fff; padding:8px 6px; text-align:center; font-weight:600; white-space:nowrap; position:sticky; top:0; }
.shoot-table td { padding:6px 4px; border:1px solid var(--border); vertical-align:middle; }
.shoot-table input,.shoot-table textarea,.shoot-table select { width:100%; padding:6px 8px; border:1px solid #ddd; border-radius:6px; font-size:12px; font-family:inherit; min-height:32px; resize:vertical; }
.shoot-table input:focus,.shoot-table textarea:focus,.shoot-table select:focus { border-color:var(--primary); outline:none; }
.shoot-table .row-num { width:28px; text-align:center; font-weight:700; color:var(--text-secondary); background:var(--bg); }
.shoot-add-row-btn { width:100%; padding:10px; border:2px dashed var(--border); border-radius:var(--radius-sm); background:#fff; color:var(--text-secondary); font-size:14px; font-weight:600; cursor:pointer; margin-bottom:12px; }
.shoot-add-row-btn:active { border-color:var(--primary); color:var(--primary); }
.generated-script { background:linear-gradient(135deg,#fff5f7,#fce4ec); border-radius:var(--radius); padding:16px; margin-top:12px; border-left:4px solid var(--primary); display:none; }
.generated-script.show { display:block; }
.generated-script h4 { font-size:16px; color:var(--primary); margin-bottom:10px; }
.generated-script .gs-scene { background:#fff; border-radius:8px; padding:12px; margin-bottom:8px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
.generated-script .gs-scene-num { font-size:11px; font-weight:700; color:var(--primary); margin-bottom:4px; }
.generated-script .gs-field { font-size:13px; line-height:1.6; margin-bottom:3px; }
.generated-script .gs-label { font-weight:600; color:var(--text-secondary); }
.gs-total-time { text-align:right; font-size:14px; font-weight:700; color:var(--primary); margin-top:8px; padding-top:8px; border-top:1px dashed var(--border); }
.storyboard-card { background:var(--bg); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; border:1.5px solid var(--border); }
.storyboard-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.storyboard-card-num { font-size:14px; font-weight:700; color:var(--primary); }
.storyboard-fields { display:grid; grid-template-columns:1fr; gap:8px; }
.sb-field { }
.sb-field label { display:block; font-size:11px; font-weight:600; color:var(--text-secondary); margin-bottom:3px; }
.sb-field input, .sb-field textarea, .sb-field select { width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:8px; font-size:13px; font-family:inherit; background:#fff; }
.sb-field input:focus, .sb-field textarea:focus, .sb-field select:focus { border-color:var(--primary); outline:none; }
.sb-row-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.req-star { color:var(--danger); margin-left:2px; }
.filter-label { font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:3px; display:block; }
.filter-row { display:flex; gap:8px; margin-bottom:12px; }
.filter-row .filter-col { flex:1; }
.filter-row select { width:100%; }
@media(min-width:768px){
  body { max-width:900px; }
  .fab { right:calc(50% - 430px); }
  .storyboard-fields { grid-template-columns:1fr 1fr 1fr; }
  .sb-field-full { grid-column:1/-1; }
  .modal { max-width:700px; margin:0 auto; border-radius:20px; }
  .summary-row { grid-template-columns:1fr 1fr 1fr 1fr; }
  .quick-grid { grid-template-columns:1fr 1fr 1fr 1fr 1fr; }
  .material-grid { grid-template-columns:1fr 1fr 1fr; }
}
.material-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.material-card { background:var(--bg); border-radius:var(--radius-sm); overflow:hidden; position:relative; }
.material-card img { width:100%; height:120px; object-fit:cover; display:block; }
.material-info { padding:8px 10px; }
.material-title { font-size:13px; font-weight:600; }
.material-tags { margin-top:4px; display:flex; flex-wrap:wrap; gap:3px; }
.material-del { position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.5); color:#fff; border:none; width:24px; height:24px; border-radius:50%; font-size:12px; cursor:pointer; }
.cc-card { padding:13px; background:var(--bg); border-radius:var(--radius-sm); margin-bottom:10px; }
.cc-title { font-size:15px; font-weight:600; }
.cc-meta { font-size:12px; color:var(--text-secondary); display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.pub-board { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
.pub-board-item { background:var(--bg); border-radius:var(--radius-sm); padding:10px; text-align:center; }
.pub-board-item .pb-num { font-size:20px; font-weight:700; }
.pub-board-item .pb-label { font-size:11px; color:var(--text-secondary); margin-top:2px; }

.home-cover { position:relative; background:linear-gradient(135deg,#e8537a,#f06292); color:#fff; border-radius:var(--radius); padding:30px 20px; text-align:center; margin-bottom:12px; box-shadow:var(--shadow); background-size:cover; background-position:center; }
.home-logo { font-size:46px; }
.home-cover h2 { font-size:21px; font-weight:700; margin-top:8px; }
.home-studio { font-size:14px; opacity:0.95; margin-top:8px; }
.home-date { font-size:12px; opacity:0.85; margin-top:5px; }
.quick-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.quick-btn { background:var(--bg); border-radius:var(--radius-sm); padding:14px 6px; text-align:center; font-size:12px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:5px; }
.quick-btn:active { background:var(--primary-light); }
.q-icon { font-size:22px; }
.photo-thumb { width:46px; height:46px; border-radius:10px; object-fit:cover; flex-shrink:0; background:var(--primary-light); display:flex; align-items:center; justify-content:center; font-size:20px; }
.retouch-board { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:14px; }

function loadData(){
  const raw=localStorage.getItem(STORAGE_KEY);
  const base={appointments:[],customers:[],products:[],transactions:[],trends:[...DEFAULT_TRENDS],topics:[],scripts:[],materials:[],contents:[],photos:[],shootPlans:[],followers:{douyin:0,xiaohongshu:0}};
  let d;
  if(!raw){
    // Try backup if main data is empty
    const bk=localStorage.getItem('beauty_wb_backup');
    if(bk){try{const bp=JSON.parse(bk);if(bp&&bp.data){d=bp.data;Object.keys(base).forEach(k=>{if(d[k]===undefined)d[k]=Array.isArray(base[k])?[]:{...base[k]};});if(!d.followers||typeof d.followers!=='object')d.followers={douyin:0,xiaohongshu:0};d.followers={douyin:d.followers.douyin||0,xiaohongshu:d.followers.xiaohongshu||0};console.log('[backup] Restored from backup');}else{d=base;}}catch(e){d=base;}}else{d=base;}
  }
  else{
    try{
      d=JSON.parse(raw);
      Object.keys(base).forEach(k=>{if(d[k]===undefined)d[k]=Array.isArray(base[k])?[]:{...base[k]};});
      if(!d.followers||typeof d.followers!=='object')d.followers={douyin:0,xiaohongshu:0};
      d.followers={douyin:d.followers.douyin||0,xiaohongshu:d.followers.xiaohongshu||0};
      if(d.trends){const ex=new Set(d.trends.map(t=>t.id));DEFAULT_TRENDS.forEach(t=>{if(!ex.has(t.id))d.trends.unshift(t);});}else d.trends=[...DEFAULT_TRENDS];
      // 迁移旧 shootDrafts 到统一 scripts
      if(d.shootDrafts&&d.shootDrafts.length){
        d.shootDrafts.forEach(sd=>{
          if(!d.scripts.find(s=>s.id===sd.id)){
            d.scripts.push({id:sd.id,title:sd.title||sd.name||'未命名脚本',type:'分镜脚本',platform:'全平台',date:(sd.savedAt||'').slice(0,10),status:'editing',notes:'',storyboard:sd.rows||[],cover:sd.cover||'',coverText:sd.coverText||'',createdAt:sd.savedAt||new Date().toISOString()});
          }
        });
        delete d.shootDrafts;
      }
      if(d.shootScripts){delete d.shootScripts;}
      // 旧 scripts 迁移
      d.scripts=d.scripts.map(s=>{
        if(!s.storyboard){
          if(s.fields&&s.fields.length){s.notes=(s.notes||'')+s.fields.map(f=>f.content?'\\n'+f.label+'：'+f.content:'').join('');}
          s.storyboard=[];
        }
        if(!s.status)s.status='editing';
        if(!s.date)s.date=(s.createdAt||'').slice(0,10)||todayStr();
        if(!s.type)s.type='自定义';
        return s;
      });
    }catch(e){d=base;}
  }
  if(!d._studioSeedDone){
    const exIds=new Set((d.transactions||[]).map(t=>t.id));
    SEED_STUDIO_EXPENSES.forEach(e=>{if(!exIds.has(e.id))d.transactions.push(e);});
    d._studioSeedDone=true;
  }
  localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
  return d;
}

function pieChartFloat(items,title,mode){
  const total=items.reduce((s,i)=>s+i.value,0);
  const defaultColors=['#e8537a','#f06292','#ffb74d','#4caf50','#42a5f5','#ab47bc','#ff7043','#26c6da','#9ccc65','#d4e157'];
  let ang=-Math.PI/2;const cx=60,cy=60,r=54;
  const segs=items.map((it,i)=>{
    const color=it.color||defaultColors[i%defaultColors.length];
    const frac=it.value/total;const a0=ang;ang+=frac*2*Math.PI;const a1=ang;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0);const x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const large=frac>0.5?1:0;
    const d='M'+cx+','+cy+' L'+x0.toFixed(2)+','+y0.toFixed(2)+' A'+r+','+r+' 0 '+large+' 1 '+x1.toFixed(2)+','+y1.toFixed(2)+' Z';
    const clickArg=mode==='all'?(it.label==='收入'?'income':'expense'):it.label;
    const isActive=finPieSlice===clickArg;
    const cls=finPieSlice&&finPieSlice!==clickArg?'pie-segment dim':'pie-segment';
    return '<path class="'+cls+'" d="'+d+'" fill="'+color+'" onclick="clickPieSlice(\''+clickArg+'\')"><title>'+it.label+' ¥'+it.value.toLocaleString()+'</title></path>';
  }).join('');
  const legend=items.map((it,i)=>{
    const color=it.color||defaultColors[i%defaultColors.length];
    const clickArg=mode==='all'?(it.label==='收入'?'income':'expense'):it.label;
    const isActive=finPieSlice===clickArg;
    const pct=total>0?((it.value/total)*100).toFixed(1):0;
    return'<div class="pie-legend-item '+(isActive?'active':'')+'" onclick="clickPieSlice(\''+clickArg+'\')"><span class="dot" style="background:'+color+'"></span>'+it.label+'<span style="color:var(--text-secondary);font-size:11px">'+pct+'%</span><b>¥'+it.value.toLocaleString()+'</b></div>';
  }).join('');
  return '<div class="pie-wrap"><svg viewBox="0 0 120 120" width="130" height="130" style="flex-shrink:0">'+segs+'<circle cx="'+cx+'" cy="'+cy+'" r="'+(r-20)+'" fill="#fff"/><text x="60" y="55" text-anchor="middle" font-size="9" fill="#888">'+title+'</text><text x="60" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="700">¥'+total.toLocaleString()+'</text></svg><div class="pie-legend">'+legend+'</div></div>';
}
function clickPieSlice(arg){
  if(finPieSlice===arg){finPieSlice=null;}else{finPieSlice=arg;}
  refreshView('finance');
}

function scriptPublish(id){

    data.contents.push({id:gid(),title:s.title,platform:s.platform||'全平台',publishDate:todayStr(),status:'planned',notes:s.notes||'',createdAt:new Date().toISOString()});

function scriptSetStatus(id,v){

    if(!data.contents.find(c=>c.title===s.title)){
      data.contents.push({id:gid(),title:s.title,platform:s.platform||'全平台',publishDate:todayStr(),status:'planned',notes:s.notes||'',createdAt:new Date().toISOString()});

function enterStoryboard(id){currentScriptId=id;refreshView('scripts');}
function exitStoryboard(){currentScriptId=null;refreshView('scripts');}
function renderScriptStoryboard(div){
  const s=data.scripts.find(x=>x.id===currentScriptId);
  if(!s){currentScriptId=null;renderScripts(div);return;}
  const rows=s.storyboard&&s.storyboard.length?s.storyboard:[getEmptyShootRow()];
  let cardsHtml='<div id="shootCardsBody">';
  rows.forEach((r,ri)=>{
    cardsHtml+='<div class="storyboard-card" id="sbCard_'+ri+'"><div class="storyboard-card-head"><span class="storyboard-card-num">🎬 镜头 '+(ri+1)+'</span><button class="btn btn-xs btn-danger" onclick="delShootRow('+ri+')">✕ 删除</button></div><div class="storyboard-fields">';
    SHOOT_SCRIPT_COLS.forEach(c=>{
      const val=r[c.key]||'';
      const cls=(c.key==='content'||c.key==='dialogue')?'sb-field sb-field-full':'sb-field';
      if(c.key==='content'||c.key==='dialogue'){
        cardsHtml+='<div class="'+cls+'"><label>'+c.label+'</label><textarea data-col="'+c.key+'" data-row="'+ri+'" placeholder="'+c.placeholder+'">'+escHtml(val)+'</textarea></div>';
      } else {
        cardsHtml+='<div class="'+cls+'"><label>'+c.label+'</label><input type="text" data-col="'+c.key+'" data-row="'+ri+'" placeholder="'+c.placeholder+'" value="'+escHtml(val)+'"></div>';
      }
    });
    cardsHtml+='</div></div>';
  });
  cardsHtml+='</div><button class="shoot-add-row-btn" onclick="addShootRow()">＋ 添加一个镜头</button>';
  div.innerHTML='<div class="card"><div class="card-header"><h3>🎬 '+escHtml(s.title)+' - 分镜拍摄</h3><button class="btn btn-xs btn-outline" onclick="exitStoryboard()">← 返回列表</button></div><div style="margin-bottom:10px"><div class="form-row"><div class="form-group"><label>封面画面描述</label><input id="ssCover" placeholder="封面画面构思" value="'+escHtml(s.cover||'')+'"></div><div class="form-group"><label>封面贴字</label><input id="ssCoverText" placeholder="封面文字" value="'+escHtml(s.coverText||'')+'"></div></div></div>'+cardsHtml+'<div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn btn-primary" style="flex:1" onclick="saveStoryboard()">💾 保存分镜</button><button class="btn btn-outline" onclick="generateShootScript()">✨ 生成预览</button></div><div class="generated-script" id="generatedScript"></div></div>';
}
function getEmptyShootRow(){const r={};SHOOT_SCRIPT_COLS.forEach(c=>r[c.key]='');return r;}
function addShootRow(){const s=data.scripts.find(x=>x.id===currentScriptId);if(!s)return;if(!s.storyboard)s.storyboard=[];s.storyboard.push(getEmptyShootRow());save();renderScriptStoryboard(document.getElementById('view-scripts'));toast('已添加一个镜头');}
function delShootRow(idx){const s=data.scripts.find(x=>x.id===currentScriptId);if(!s||!s.storyboard)return;if(s.storyboard.length<=1){toast('至少保留一行');return;}s.storyboard.splice(idx,1);save();renderScriptStoryboard(document.getElementById('view-scripts'));toast('已删除');}
function collectShootData(){
  const s=data.scripts.find(x=>x.id===currentScriptId);if(!s)return{meta:{},rows:[]};
  const meta={cover:document.getElementById('ssCover')?.value?.trim()||'',coverText:document.getElementById('ssCoverText')?.value?.trim()||''};
  const rows=[];document.querySelectorAll('#shootCardsBody .storyboard-card').forEach(card=>{const row={};card.querySelectorAll('input,textarea').forEach(el=>{row[el.dataset.col]=el.value.trim();});rows.push(row);});
  return{meta,rows};
}
function saveStoryboard(){
  const s=data.scripts.find(x=>x.id===currentScriptId);if(!s)return;
  const{meta,rows}=collectShootData();s.storyboard=rows;s.cover=meta.cover;s.coverText=meta.coverText;save();toast('分镜已保存 💾');
}
function generateShootScript(){
  const s=data.scripts.find(x=>x.id===currentScriptId);if(!s)return;
  const{meta,rows}=collectShootData();
  const hasContent=rows.some(r=>r.content||r.dialogue);if(!hasContent){toast('请先填写画面内容或台词');return;}
  let totalTime=0;let html='<h4>🎬 '+escHtml(s.title)+'</h4>';
  if(meta.cover)html+='<div class="gs-field"><span class="gs-label">🖼️ 封面画面：</span>'+escHtml(meta.cover)+'</div>';
  if(meta.coverText)html+='<div class="gs-field"><span class="gs-label">✏️ 封面贴字：</span>'+escHtml(meta.coverText)+'</div>';
  html+='<hr style="margin:10px 0;border:none;border-top:1px dashed var(--primary)">';
  rows.forEach((r,ri)=>{
    if(!r.content&&!r.dialogue&&!r.scene)return;
    const dur=parseInt(r.duration)||0;totalTime+=dur;
    html+='<div class="gs-scene"><div class="gs-scene-num">镜头 '+(ri+1)+(r.scene?' · '+escHtml(r.scene):'')+(r.shot?' · '+escHtml(r.shot):'')+(dur?' · '+dur+'s':'')+'</div>';
    if(r.content)html+='<div class="gs-field"><span class="gs-label">📹 画面：</span>'+escHtml(r.content)+'</div>';
    if(r.dialogue)html+='<div class="gs-field"><span class="gs-label">🎤 台词：</span><b>'+escHtml(r.dialogue)+'</b></div>';
    if(r.notes)html+='<div class="gs-field"><span class="gs-label">📝 备注：</span>'+escHtml(r.notes)+'</div>';
    if(r.material)html+='<div class="gs-field"><span class="gs-label">🎞️ 素材：</span>'+escHtml(r.material)+'</div>';
    if(r.music)html+='<div class="gs-field"><span class="gs-label">🎵 音乐/音效：</span>'+escHtml(r.music)+'</div>';
    if(r.effect)html+='<div class="gs-field"><span class="gs-label">✨ 特效：</span>'+escHtml(r.effect)+'</div>';
    html+='</div>';
  });
  html+='<div class="gs-total-time">⏱ 总时长约 '+totalTime+' 秒 ('+(totalTime/60).toFixed(1)+' 分钟)</div>';
  html+='<div style="text-align:right;margin-top:10px"><button class="copy-btn" onclick="copyGeneratedScript()">📋 复制完整脚本</button> <button class="copy-btn" onclick="saveStoryboard()">💾 保存分镜</button></div>';
  const gs=document.getElementById('generatedScript');gs.innerHTML=html;gs.classList.add('show');gs.scrollIntoView({behavior:'smooth',block:'nearest'});toast('脚本生成完成 ✨');
}
function copyGeneratedScript(){const gs=document.getElementById('generatedScript');if(!gs)return;navigator.clipboard.writeText(gs.innerText).then(()=>toast('已复制到剪贴板 📋'));}

function saveMaterial(){
  const file=document.getElementById('fMi').files[0];const title=document.getElementById('fMt').value.trim();const tags=document.getElementById('fMtag').value.split(',').map(t=>t.trim()).filter(Boolean);const notes=document.getElementById('fMno').value.trim();

  if(file){compressImage(file,done);}else{done('');}

function compressImage(file,cb){
  const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const maxW=800;const sc=Math.min(maxW/img.width,1);c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.7));};img.src=e.target.result;};reader.readAsDataURL(file);
}

function exportData(){
  const exportObj={appVersion:STORAGE_KEY,exportDate:new Date().toISOString(),device:navigator.userAgent.slice(0,50),data:data};
  const json=JSON.stringify(exportObj,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const filename='beauty-backup-'+todayStr()+'.json';
  const file=new File([blob],filename,{type:'application/json'});
  localStorage.setItem('beauty_wb_lastbackup',Date.now().toString());
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'美妆工作台数据备份'}).then(()=>{
      toast('备份已分享，请保存到安全位置');
      refreshView('settings');
    }).catch(()=>{
      // User cancelled share, try download fallback
      downloadBackup(blob,filename);
    });
  }else{
    downloadBackup(blob,filename);
  }
}
function downloadBackup(blob,filename){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('备份已下载');
    refreshView('settings');
  }catch(e){
    // Last resort: open in new tab
    const url=URL.createObjectURL(blob);
    window.open(url);
    toast('备份已在新窗口打开，请保存');
  }
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const imported=JSON.parse(e.target.result);
      if(imported.data){
        if(confirm('导入将覆盖当前所有数据！\n\n备份文件导出时间：'+(imported.exportDate||'未知')+'\n\n确定要继续吗？')){
          data=imported.data;
          const base={appointments:[],customers:[],products:[],transactions:[],trends:[...DEFAULT_TRENDS],topics:[],scripts:[],materials:[],contents:[],photos:[],shootPlans:[],followers:{douyin:0,xiaohongshu:0}};
          Object.keys(base).forEach(k=>{if(data[k]===undefined)data[k]=base[k];});
          if(!data.followers||typeof data.followers!=='object')data.followers={douyin:0,xiaohongshu:0};
          data.followers={douyin:data.followers.douyin||0,xiaohongshu:data.followers.xiaohongshu||0};
          save();closeModal();
          localStorage.setItem('beauty_wb_lastbackup',Date.now().toString());
          refreshView(currentView);
          toast('✅ 数据导入成功');
        }
      }else{toast('❌ 文件格式错误，请选择正确的备份文件');}
    }catch(err){toast('❌ 导入失败：文件格式错误');}
  };
  reader.readAsText(file);
  input.value='';
}

// ============ INIT ============
function init(){
  document.querySelectorAll('.nav-item,.nav-home').forEach(n=>{
    n.addEventListener('click',e=>{e.stopPropagation();switchView(n.dataset.view);});
  });
  switchView('home');
  if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
}
init();
</script>
